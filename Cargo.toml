[package]
name = "realttylog"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23.1"
eframe = "0.35.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify = "8.2.0"
quick-xml = "0.41.0"
regex = "1.13.1"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

# Constitució, Restriccions tècniques: binari objectiu de 5-15 MB per
# plataforma. El perfil `dev` es queda amb els valors per defecte per no
# alentir la iteració.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
